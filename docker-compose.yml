# =============================================================================
# Identity Radar — Full Stack Docker Compose
# Services: db (PostgreSQL), init (migrations/seed), app (Next.js), scheduler,
# backup, caddy. AI runs on the host's own Ollama install (not in a container):
# the app reaches it at http://host.docker.internal:11434 (override OLLAMA_URL).
#
# Usage:
#   docker compose up              # start the stack
#   docker compose down            # stop (data persists)
#   docker compose down -v         # stop + wipe all data (clean slate)
# =============================================================================

# Fixed stack name: volumes are always identity-radar_pgdata etc., whatever the
# folder is called, so an update extracted from a new ZIP keeps its data.
# deploy/scripts/docker-up.sh migrates data from older folder-named stacks.
name: identity-radar

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: idr-db
    restart: unless-stopped
    ports:
      # Loopback only: the database must not be reachable from the network.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity_radar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-identity_radar}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Init — one-shot container for schema push, views, and seed
  # Exits after completion. Re-run is safe (idempotent).
  # ---------------------------------------------------------------------------
  init:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: init
    container_name: idr-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-identity_radar}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # true (default here) loads the Acme demo organization into an empty database
      SEED_DEMO: ${SEED_DEMO:-true}
    restart: "no"

  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: runner
    container_name: idr-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      # Loopback only by default: remote clients go through Caddy (80/443),
      # which sets X-Real-IP for rate limiting. Set APP_BIND_ADDRESS=0.0.0.0
      # to expose port 3000 on the network.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    # Lets OLLAMA_URL=http://host.docker.internal:11434 reach Ollama on the host (Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-identity_radar}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required - run ./deploy/scripts/docker-up.sh or add it to .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      # ollama | anthropic | none; unset = Ollama first, then Anthropic if a key is set
      AI_PROVIDER: ${AI_PROVIDER:-}
      # Ollama runs on the host (always installed); not part of this stack
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      NODE_ENV: production

  # ---------------------------------------------------------------------------
  # Scheduler — calls the /api/cron/* scans on their cadence (same image as app)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: runner
    container_name: idr-scheduler
    restart: unless-stopped
    command: ["node", "scheduler.mjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:-}
      SCHEDULE_TZ: ${SCHEDULE_TZ:-UTC}
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Backup — daily pg_dump to ./backups (restore with deploy/scripts/restore.sh)
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: idr-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-identity_radar}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./deploy/docker/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups

  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy with automatic HTTPS (Let's Encrypt)
  # Set DOMAIN env var to your FQDN (e.g., identityradar.alialmoharif.com)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: idr-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
